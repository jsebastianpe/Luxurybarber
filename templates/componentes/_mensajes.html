{% if messages %}
<div class="pointer-events-none fixed inset-x-0 top-20 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite">
  {% for m in messages %}
  <div x-data="{ v: true }" x-init="setTimeout(() => v = false, 5000)" x-show="v" x-transition.opacity
       class="pointer-events-auto flex w-full max-w-md items-start gap-3 rounded-card border px-4 py-3 text-sm shadow-lg
              {% if m.tags == 'error' %}border-poste/60 bg-[#2a1513] text-marfil-50
              {% elif m.tags == 'success' %}border-salvia/60 bg-[#14231a] text-marfil-50
              {% else %}border-laton-500/50 bg-carbon-800 text-marfil-50{% endif %}">
    <span class="mt-0.5 h-2 w-2 flex-none rounded-full {% if m.tags == 'error' %}bg-poste{% elif m.tags == 'success' %}bg-salvia{% else %}bg-laton-500{% endif %}"></span>
    <p class="flex-1">{{ m }}</p>
    <button type="button" @click="v = false" class="text-piedra-400 hover:text-marfil-50" aria-label="Cerrar">✕</button>
  </div>
  {% endfor %}
</div>
{% endif %}
